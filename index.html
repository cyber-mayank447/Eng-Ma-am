<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mithlesh Ma'am | Master in English</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Great+Vibes&family=Poppins:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #07080d;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            perspective: 1000px;
        }

        /* Sakura & Floating Particles Background */
        .particle-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            border-radius: 150% 0 150% 0;
            animation: fall 6s linear infinite;
            opacity: 0.8;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg) scale(0.8); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg) scale(1.2); opacity: 0.1; }
        }

        /* Ultimate Glass Card */
        .master-card {
            position: relative;
            z-index: 10;
            width: 390px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 28px;
            padding: 45px 30px;
            text-align: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 
                        0 0 40px rgba(255, 117, 140, 0.25),
                        inset 0 0 20px rgba(255, 255, 255, 0.05);
            transition: transform 0.2s ease-out, box-shadow 0.3s ease;
            transform-style: preserve-3d;
        }

        .master-card:hover {
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.8), 
                        0 0 60px rgba(255, 117, 140, 0.5);
        }

        /* Monogram Box */
        .crown-box {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
        }

        .ring-aura {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: conic-gradient(#ff758c, #ffd700, #7928ca, #ff758c);
            animation: rotateAura 4s linear infinite;
            filter: blur(2px);
        }

        @keyframes rotateAura {
            100% { transform: rotate(360deg); }
        }

        .monogram {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #0f1017;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 54px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #ff758c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            border: 3px solid #1a1b26;
            box-shadow: inset 0 0 15px rgba(255, 117, 140, 0.5);
        }

        .badge-tag {
            display: inline-block;
            padding: 6px 18px;
            background: linear-gradient(90deg, rgba(255, 117, 140, 0.2), rgba(255, 215, 0, 0.2));
            border: 1px solid rgba(255, 215, 0, 0.5);
            color: #ffd700;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2.5px;
            border-radius: 50px;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(255, 117, 140, 0.7);
            margin-bottom: 4px;
        }

        .sub-title {
            font-family: 'Great Vibes', cursive;
            color: #ff758c;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        /* Auto Typing Text Container */
        .typewriter-box {
            min-height: 75px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quote-text {
            color: #e2e8f0;
            font-size: 0.95rem;
            line-height: 1.6;
            font-style: italic;
            font-weight: 300;
        }

        /* Action Button */
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            padding: 12px 28px;
            background: linear-gradient(45deg, #ff758c, #7928ca);
            color: #fff;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 117, 140, 0.4);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 30px rgba(255, 117, 140, 0.8);
        }

        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="particle-container" id="particles"></div>

    <div class="master-card" id="card">
        <div class="crown-box">
            <div class="ring-aura"></div>
            <div class="monogram">M</div>
        </div>

        <div class="badge-tag">👑 MASTER IN ENGLISH</div>
        <h1>Mithlesh Ma'am</h1>
        <div class="sub-title">An Exceptional Educator & Guide</div>

        <div class="typewriter-box">
            <p class="quote-text" id="typedText"></p>
        </div>

        <div class="btn-group">
            <button class="btn" onclick="triggerCelebration()">Celebrate ✨</button>
        </div>
    </div>

    <!-- Canvas Confetti Engine -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        // 3D Tilt Effect
        const card = document.getElementById('card');
        document.addEventListener('mousemove', (e) => {
            let xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            let yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Falling Sakura Particles
        const pContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            let p = document.createElement('div');
            p.classList.add('particle');
            p.style.left = Math.random() * 100 + 'vw';
            p.style.width = Math.random() * 8 + 6 + 'px';
            p.style.height = Math.random() * 12 + 8 + 'px';
            p.style.animationDuration = Math.random() * 4 + 4 + 's';
            p.style.animationDelay = Math.random() * 4 + 's';
            pContainer.appendChild(p);
        }

        // Live Typewriter Effect
        const message = '"A truly great teacher inspires hope, ignites the imagination, and instills a lifelong love of learning."';
        let index = 0;
        const textElement = document.getElementById('typedText');

        function typeWriter() {
            if (index < message.length) {
                textElement.innerHTML += message.charAt(index);
                index++;
                setTimeout(typeWriter, 35);
            }
        }
        window.onload = typeWriter;

        // Confetti Celebration Trigger
        function triggerCelebration() {
            var count = 200;
            var defaults = { origin: { y: 0.7 } };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, { spread: 26, startVelocity: 55 });
            fire(0.2, { spread: 60 });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45 });
        }
    </script>
</body>
</html>

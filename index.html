
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mithlesh Ma'am 📸</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 450px;
      background: white;
      padding: 25px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0, 0, 0, .25);
    }

    h1 {
      color: #ff477e;
      margin-bottom: 10px;
    }

    p {
      color: #666;
      margin-bottom: 15px;
    }

    .camera-box {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 18px;
      background: #111;
      margin-top: 15px;
    }

    video,
    #photo {
      display: block;
      width: 100%;
      border-radius: 18px;
    }

    #photo {
      display: none;
      margin-top: 15px;
    }

    #countdown {
      min-height: 55px;
      font-size: 45px;
      font-weight: bold;
      color: #ff477e;
      margin: 15px 0;
    }

    button {
      border: none;
      background: #ff477e;
      color: white;
      padding: 14px 22px;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      margin: 8px 4px;
      transition: .2s;
    }

    button:hover {
      background: #e9366b;
      transform: scale(1.03);
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    #saveBtn {
      display: none;
      background: #4CAF50;
    }

    #saveBtn:hover {
      background: #3d963f;
    }

    #restartBtn {
      display: none;
      background: #555;
    }

    canvas {
      display: none;
    }

    .status {
      font-size: 14px;
      color: #888;
      margin-top: 8px;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>🌸 Mithlesh Ma'am 🌸</h1>

    <p>Camera ready 📸</p>

    <div class="camera-box">
      <video
        id="camera"
        autoplay
        playsinline
        muted>
      </video>
    </div>

    <div id="countdown"></div>

    <button id="takeBtn" type="button">
      📸 Take Photo
    </button>

    <button id="saveBtn" type="button">
      💾 Save Photo
    </button>

    <button id="restartBtn" type="button">
      🔄 Restart Camera
    </button>

    <canvas id="canvas"></canvas>

    <img id="photo" alt="Captured Photo">

    <div class="status" id="status">
      Camera starting...
    </div>

  </div>

  <script>
    const video = document.getElementById("camera");
    const canvas = document.getElementById("canvas");
    const photo = document.getElementById("photo");
    const countdown = document.getElementById("countdown");

    const takeBtn = document.getElementById("takeBtn");
    const saveBtn = document.getElementById("saveBtn");
    const restartBtn = document.getElementById("restartBtn");
    const status = document.getElementById("status");

    let stream = null;
    let isCounting = false;
    let countdownTimer = null;
    let lastPhotoURL = null;


    // ------------------------------------
    // START CAMERA
    // ------------------------------------
    async function startCamera() {

      // Stop old stream safely
      stopCamera();

      status.innerText = "Camera starting...";
      takeBtn.disabled = true;
      restartBtn.style.display = "none";

      try {

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {

          throw new Error("Camera API not supported");
        }

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: {
              ideal: 1280
            },
            height: {
              ideal: 720
            }
          },
          audio: false
        });

        video.srcObject = stream;

        // IMPORTANT:
        // Wait until video actually has frames.
        await waitForVideo();

        status.innerText = "Camera ready 📸";
        takeBtn.disabled = false;

      } catch (error) {

        console.error("Camera Error:", error);

        status.innerText =
          "Camera permission allow karo bhai 😅";

        restartBtn.style.display = "inline-block";

        alert(
          "Camera access nahi mil raha.\n\n" +
          "Browser me Camera Permission → Allow karo."
        );
      }
    }


    // ------------------------------------
    // WAIT FOR VIDEO TO BE READY
    // ------------------------------------
    function waitForVideo() {

      return new Promise((resolve, reject) => {

        const timeout = setTimeout(() => {
          reject(new Error("Camera timeout"));
        }, 10000);

        function checkVideo() {

          if (
            video.readyState >= 2 &&
            video.videoWidth > 0 &&
            video.videoHeight > 0
          ) {

            clearTimeout(timeout);

            // Make sure video is actually playing
            video.play()
              .then(resolve)
              .catch(resolve);

          } else {

            requestAnimationFrame(checkVideo);
          }
        }

        checkVideo();
      });
    }


    // ------------------------------------
    // TAKE PHOTO
    // ------------------------------------
    function takePhoto() {

      // Prevent double clicking
      if (isCounting) {
        return;
      }

      // Camera must be ready
      if (
        !stream ||
        !video.srcObject ||
        video.readyState < 2 ||
        video.videoWidth === 0 ||
        video.videoHeight === 0
      ) {

        alert("Camera abhi ready nahi hai bhai 😅");
        return;
      }

      isCounting = true;
      takeBtn.disabled = true;

      let number = 3;

      countdown.innerText = number;

      countdownTimer = setInterval(() => {

        number--;

        if (number > 0) {
          countdown.innerText = number;
        }

        if (number === 0) {

          clearInterval(countdownTimer);
          countdownTimer = null;

          countdown.innerText = "📸";

          // Small delay ensures latest video frame is available
          setTimeout(() => {

            capturePhoto();

          }, 250);
        }

      }, 1000);
    }


    // ------------------------------------
    // CAPTURE PHOTO
    // ------------------------------------
    function capturePhoto() {

      try {

        // Re-check video before capturing
        if (
          video.readyState < 2 ||
          video.videoWidth === 0 ||
          video.videoHeight === 0
        ) {

          throw new Error("Video frame not ready");
        }

        const width = video.videoWidth;
        const height = video.videoHeight;

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d", {
          alpha: false
        });

        ctx.clearRect(0, 0, width, height);

        /*
          IMPORTANT FIX:

          Do NOT stop the camera after taking a photo.

          The old code did:
          stream.getTracks().forEach(track => track.stop());

          That caused the second capture to become black.
        */

        ctx.drawImage(
          video,
          0,
          0,
          width,
          height
        );

        // Generate fresh image
        const imageData = canvas.toDataURL(
          "image/jpeg",
          0.92
        );

        // Remove previous object URL if any
        if (lastPhotoURL) {
          URL.revokeObjectURL(lastPhotoURL);
          lastPhotoURL = null;
        }

        photo.src = imageData;
        photo.style.display = "block";

        saveBtn.style.display = "inline-block";

        countdown.innerText = "Photo clicked ❤️";

        status.innerText =
          "Photo ready! Dobara bhi click kar sakte ho 📸";

      } catch (error) {

        console.error("Capture Error:", error);

        countdown.innerText = "❌";

        status.innerText =
          "Photo capture nahi ho payi. Camera restart karo.";

      } finally {

        isCounting = false;
        takeBtn.disabled = false;
      }
    }


    // ------------------------------------
    // SAVE PHOTO
    // ------------------------------------
    function savePhoto() {

      if (!canvas.width || !canvas.height) {

        alert("Pehle photo click karo bhai 📸");
        return;
      }

      canvas.toBlob(
        function(blob) {

          if (!blob) {
            alert("Photo save nahi ho payi.");
            return;
          }

          const url = URL.createObjectURL(blob);

          const link = document.createElement("a");

          link.href = url;
          link.download =
            "Mithlesh-Maam-" +
            Date.now() +
            ".jpg";

          document.body.appendChild(link);

          link.click();

          link.remove();

          setTimeout(() => {
            URL.revokeObjectURL(url);
          }, 1000);

        },
        "image/jpeg",
        0.92
      );
    }


    // ------------------------------------
    // STOP CAMERA
    // ------------------------------------
    function stopCamera() {

      if (stream) {

        stream.getTracks().forEach(track => {
          try {
            track.stop();
          } catch (e) {
            console.warn(e);
          }
        });

        stream = null;
      }

      video.srcObject = null;
    }


    // ------------------------------------
    // RESTART CAMERA
    // ------------------------------------
    restartBtn.addEventListener("click", () => {

      countdown.innerText = "";

      photo.style.display = "none";

      saveBtn.style.display = "none";

      startCamera();
    });


    // ------------------------------------
    // BUTTON EVENTS
    // ------------------------------------
    takeBtn.addEventListener(
      "click",
      takePhoto
    );

    saveBtn.addEventListener(
      "click",
      savePhoto
    );


    // ------------------------------------
    // PAGE LOAD
    // ------------------------------------
    window.addEventListener(
      "load",
      startCamera
    );


    // ------------------------------------
    // CLEANUP
    // ------------------------------------
    window.addEventListener(
      "beforeunload",
      () => {

        if (countdownTimer) {
          clearInterval(countdownTimer);
        }

        stopCamera();

        if (lastPhotoURL) {
          URL.revokeObjectURL(lastPhotoURL);
        }
      }
    );

  </script>

</body>
</html>
